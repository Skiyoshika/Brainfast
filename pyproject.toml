[project]
name = "brainfast"
description = "Brain atlas registration and cell counting for cleared-tissue microscopy"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dynamic = ["version"]

dependencies = [
    "flask>=3.0",
    "waitress>=3.0",
    "numpy>=1.26,<3",
    "packaging>=24.0",
    "pandas>=2.2",
    "pillow>=10.0",
    "scipy>=1.12,<2",
    "scikit-image>=0.22,<1",
    "tifffile>=2024.2",
    "nibabel>=5.2",
    "tqdm>=4.66",
    "matplotlib>=3.8",
    "natsort>=8.4",
]

[project.optional-dependencies]
# pip install -e ".[wholebrain]"  — ANTs-based whole-brain 3D registration
wholebrain = [
    "antspyx>=0.4",
]
# pip install -e ".[advanced]"  — enables CellPose GPU detection + SimpleITK
advanced = [
    "SimpleITK>=2.3",
    "antspyx>=0.6.3",
    "cellpose>=2.2",
]
# pip install -e ".[neuroglancer]"  — self-hosted Neuroglancer viewer +
# OME-Zarr converter ported from UCI-XuLab-RegTools.  Optional because the
# core pipeline doesn't require these packages; only the 3D browsing
# endpoints exposed by project/scripts/ng_viewer and ng_converter do.
neuroglancer = [
    "neuroglancer>=2.39",
    "ome-zarr>=0.9",
    "zarr>=2.17,<3",
]
# pip install -e ".[stitching]"  — TissueCyte mosaic tile stitching pipeline
# ported from UCI-XuLab-RegTools.  Optional because it only applies to raw
# multi-tile acquisition data; pre-stitched inputs (the common case) don't
# need these packages.
stitching = [
    "opencv-python>=4.8",
    "colorama>=0.4",
    "joblib>=1.3",
]
# pip install -e ".[full]"  — all optional runtime deps
full = [
    "brainfast[wholebrain,advanced,neuroglancer,stitching]",
]
# pip install -e ".[desktop]"  — for building a Windows EXE
desktop = [
    "pyinstaller>=6.0",
]
# pip install -e ".[dev]"  — developer tools
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "pytest-mock",
    "pytest-timeout",
    "pre-commit",
    "ruff",
    "jsonschema>=4.21",
    "openpyxl>=3.1",
]

[project.scripts]
brainfast-server   = "project.frontend.server:main"
brainfast-pipeline = "project.scripts.main:main"

[build-system]
requires = ["setuptools>=65", "setuptools-scm>=8.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
write_to = "project/_version.py"
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"

[tool.setuptools.packages.find]
where = ["."]
include = ["project*"]

[tool.pytest.ini_options]
testpaths = ["project/tests"]
markers = [
    "unit: fast tests — no atlas file or real images required",
    "integration: tests that require annotation_25.nii.gz or real slice data",
    "slow: tests that take >10s",
]
addopts = "-v --timeout=300 --timeout-method=thread"

[tool.ruff]
# Settings kept in ruff.toml at repo root
