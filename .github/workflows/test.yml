name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:   # allow manual trigger from GitHub UI (e.g. to run integration tests)

jobs:
  # ── Fast unit tests (no atlas file required) ──────────────────────────────
  unit:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + test tools
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: |
          python -m pytest project/tests/unit/ -v --tb=short --cov=project/scripts --cov-report=term-missing --cov-fail-under=20

  # ── Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check project/scripts/ project/frontend/blueprints/ project/frontend/server_context.py project/frontend/app_metadata.py project/frontend/update_checker.py

      - name: Run ruff format check
        run: ruff format --check project/scripts/ project/frontend/blueprints/ project/frontend/server_context.py project/frontend/app_metadata.py project/frontend/update_checker.py

  # ── Smoke test: default shipped path (wholebrain + cpsam) ─────────────────
  smoke-default-path:
    name: Smoke test default path
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install full stack
        run: pip install -e ".[full,dev]"

      - name: Verify check_env.py against template config
        run: python project/scripts/check_env.py --config project/configs/run_config.template.json

      - name: Import smoke test (numerical stack + ANTs + Cellpose)
        run: |
          python -c "import numpy; print('numpy', numpy.__version__)"
          python -c "import scipy; print('scipy', scipy.__version__)"
          python -c "import skimage; print('skimage', skimage.__version__)"
          python -c "import nibabel; print('nibabel', nibabel.__version__)"
          python -c "from cellpose.models import CellposeModel; print('cellpose OK')"

      - name: Run unit tests with full deps
        run: python -m pytest project/tests/unit/ -q --tb=short

      - name: Run detector-preview unit tests
        run: python -m pytest project/tests/unit/test_detect_preview_api.py -v --tb=short

      - name: Run default-path integration smoke test
        run: python -m pytest project/tests/integration/test_default_path_smoke.py -v --tb=short

  # ── Integration tests (self-hosted, has atlas file) ───────────────────────
  # Requires a self-hosted runner registered with the label "brainfast"
  # that has annotation_25.nii.gz on disk.
  #
  # To register a runner:
  #   GitHub → Settings → Actions → Runners → New self-hosted runner
  #   Run the installer, add label: brainfast
  #
  # Once registered, remove the 'if: false' guard to activate.
  integration:
    name: Integration tests (self-hosted)
    runs-on: [self-hosted, brainfast]
    if: false   # ← remove this line after registering the self-hosted runner
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[full,dev]"

      - name: Run integration tests
        run: |
          python -m pytest project/tests/integration/ -v --tb=short
